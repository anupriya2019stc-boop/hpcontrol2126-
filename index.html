<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Selvan 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-1: #ffeef5;
      --bg-pink-2: #ffd9e8;
      --bg-pink-3: #ffc2dc;
      --accent-rose: #e64980;
      --accent-deep: #b51753;
      --card-bg: rgba(255, 255, 255, 0.86);
      --text-main: #4a152b;
      --text-soft: #7c3552;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      font-family: 'Poppins', sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at top left, #fff7fb 0%, var(--bg-pink-1) 42%, var(--bg-pink-2) 100%);
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Ambient floating pink hearts background */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      bottom: -80px;
      color: rgba(255, 133, 179, 0.35);
      filter: drop-shadow(0 6px 14px rgba(255, 105, 160, 0.25));
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.9);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      50% {
        transform: translateY(-50vh) translateX(18px) rotate(12deg) scale(1.05);
      }
      85% {
        opacity: 0.65;
      }
      100% {
        transform: translateY(-115vh) translateX(-16px) rotate(-10deg) scale(0.95);
        opacity: 0;
      }
    }

    /* Sparkle / Confetti / Balloon layer */
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 40;
    }

    .sparkle-heart {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      z-index: 50;
      animation: sparkleBurst 1.35s ease-out forwards;
    }

    @keyframes sparkleBurst {
      0% {
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35) rotate(var(--rot));
        opacity: 0;
      }
    }

    .jiguna-piece {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 45;
      animation: jigunaFall var(--dur, 3.6s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes jigunaFall {
      0% {
        transform: translateY(-20px) translateX(0) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      50% {
        transform: translateY(50vh) translateX(var(--sway, 25px)) rotate(220deg) scale(1.08);
        opacity: 0.95;
      }
      100% {
        transform: translateY(108vh) translateX(calc(var(--sway, 25px) * -0.6)) rotate(460deg) scale(0.9);
        opacity: 0;
      }
    }

    /* Main Stage Card */
    .stage-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
    }

    .screen {
      display: none;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 22px 55px rgba(214, 72, 128, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      padding: 34px 24px;
      text-align: center;
      animation: screenFadeIn 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.active {
      display: block;
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Password / Lock Screen */
    .lock-badge {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff9ec4, #ff5c98);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 12px 26px rgba(255, 92, 152, 0.32);
      animation: gentlePulse 2.4s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .title-pink {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      color: var(--accent-deep);
      margin-bottom: 6px;
    }

    .sub-pink {
      font-size: 0.92rem;
      color: var(--text-soft);
      margin-bottom: 20px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #f07da8;
      background: transparent;
      transition: all 0.25s ease;
    }

    .pin-dot.filled {
      background: #ff4d8d;
      border-color: #ff4d8d;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255, 77, 141, 0.5);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 265px;
      margin: 0 auto 10px;
    }

    .key-btn {
      height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255, 143, 186, 0.45);
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent-deep);
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(230, 73, 128, 0.1);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .key-btn:active {
      transform: scale(0.93);
      background: #ffe0ed;
    }

    .err-msg {
      min-height: 22px;
      font-size: 0.85rem;
      color: #d62859;
      margin-top: 8px;
      font-weight: 500;
    }

    /* Step 2: 5 Smileys */
    .click-hint {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-deep);
      background: #fff0f6;
      border: 1px dashed #ff8fb8;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .smileys-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 22px;
    }

    .smiley-item {
      font-size: 3.1rem;
      line-height: 1.1;
      cursor: pointer;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(255, 158, 196, 0.4);
      box-shadow: 0 8px 18px rgba(235, 94, 148, 0.12);
      transition: transform 0.22s ease, opacity 0.3s ease, background 0.3s ease;
      user-select: none;
    }

    .smiley-item:hover {
      transform: scale(1.12);
    }

    .smiley-item.clicked {
      background: #ffe3ef;
      border-color: #ff6fa5;
      transform: scale(0.95);
    }

    /* Steps 3, 4, 5 */
    .tease-emoji {
      font-size: 4.3rem;
      margin-bottom: 14px;
      animation: gentlePulse 2.6s ease-in-out infinite;
    }

    .tease-text {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-deep);
      line-height: 1.45;
      margin-bottom: 24px;
    }

    /* Buttons */
    .btn-soft {
      background: linear-gradient(135deg, #ff6fa5, #e64980);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 13px 28px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(230, 73, 128, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.4s ease;
    }

    .btn-soft:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(230, 73, 128, 0.34);
    }

    .btn-soft:active {
      transform: scale(0.96);
    }

    .btn-soft.hidden-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    /* Step 6: Cake & Slow 1 2 3 */
    .cake-box {
      font-size: 6.4rem;
      line-height: 1.1;
      margin: 18px auto 14px;
      cursor: pointer;
      display: inline-block;
      filter: drop-shadow(0 12px 22px rgba(230, 73, 128, 0.22));
      transition: transform 0.25s ease;
      user-select: none;
    }

    .cake-box:hover {
      transform: scale(1.07);
    }

    .countdown-area {
      min-height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .slow-num {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      font-weight: 700;
      color: var(--accent-deep);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.85s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slow-num.show {
      opacity: 1;
      transform: scale(1.08);
    }

    .slow-num.fade-out {
      opacity: 0;
      transform: scale(1.25);
    }

    .wish-reveal {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--accent-deep);
      line-height: 1.35;
      animation: screenFadeIn 1.1s ease forwards;
    }

    /* Step 7 & 8 */
    .big-wish {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--accent-deep);
      line-height: 1.4;
      margin: 14px 0 24px;
    }

    .sorry-card {
      background: rgba(255, 243, 248, 0.92);
      border: 1px solid #ffc7de;
      border-radius: 22px;
      padding: 24px 18px;
      margin-bottom: 24px;
    }

    .sorry-line-1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-deep);
      margin-bottom: 10px;
    }

    .sorry-line-2 {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text-soft);
    }

    /* Step 9: Stylish Letter with Line-by-Line Typewriter & Auto-Scroll */
    .letter-header {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--accent-deep);
      margin-bottom: 14px;
    }

    .letter-scroll-box {
      max-height: 330px;
      overflow-y: auto;
      text-align: left;
      padding: 22px 20px;
      border-radius: 22px;
      background: linear-gradient(180deg, #fffafd 0%, #fff0f6 100%);
      border: 1.5px solid #ffc6de;
      box-shadow: inset 0 2px 12px rgba(230, 73, 128, 0.08);
      scroll-behavior: smooth;
      margin-bottom: 20px;
    }

    .letter-scroll-box::-webkit-scrollbar {
      width: 5px;
    }

    .letter-scroll-box::-webkit-scrollbar-thumb {
      background: #f59ec0;
      border-radius: 999px;
    }

    .letter-line {
      font-family: 'Playfair Display', 'Poppins', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #4b142a;
      margin-bottom: 14px;
      min-height: 1.4em;
    }

    .letter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background: var(--accent-rose);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blinkCursor 0.85s infinite;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
